[package]
name = "araview-gpui"
version = "2.4.1"
description = "Desktop image viewer (GPUI Kit) for Windows, macOS and Linux"
authors = ["Ara"]
license = "EUPL-1.2"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "araview"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.7.3"
araview-core = { path = "../crates/araview-core" }
anyhow = "1"
image = { version = "0.25", default-features = false }
half = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
raw-window-handle = "0.6"
ureq = "3"
rfd = { version = "0.17", default-features = false }
minisign-verify = "0.3"
base64 = "0.23"

# HDR 출력에서 스왑체인 경로를 고르려고 직접 의존한다(루트 Cargo.toml의 포크 patch).
[target.'cfg(windows)'.dependencies]
gpui_windows = { package = "gpui-pre-windows", version = "0.3.9" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux의 파일 선택 창은 xdg-desktop-portal을 쓴다(백엔드를 고르지 않으면 빌드가 실패한다).
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[dev-dependencies]
tempfile = "3"
minisign = "0.10"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
