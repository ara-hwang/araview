[package]
name = "araview-gpui"
version = "1.2.2"
description = "Windows desktop image viewer (GPUI Kit)"
authors = ["Ara"]
license = "EUPL-1.2"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "araview-gpui"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.7.1"
araview-core = { path = "../src-tauri/crates/araview-core" }
anyhow = "1"
image = { version = "0.25", default-features = false }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
raw-window-handle = "0.6"
ureq = "3"
rfd = { version = "0.17", default-features = false }
minisign-verify = "0.2"
base64 = "0.22"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
tempfile = "3"
minisign = "0.10"

[build-dependencies]
embed-resource = "3"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
image = { opt-level = 3 }

[profile.release]
codegen-units = 1
lto = "fat"

[workspace]
