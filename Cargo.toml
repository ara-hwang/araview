[workspace]
resolver = "3"
members = ["crates/araview-core", "crates/araview-thumb", "app"]

[profile.release]
codegen-units = 1
lto = "fat"

# GPUI는 디버그 빌드에서 느려지는 부분이 많아 핵심 크레이트만 최적화한다.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
image = { opt-level = 3 }

# HDR 출력용 포크(docs/hdr-display.md M2): HDR 모드에서 hwnd 스왑체인을 쓴다.
# 명령 팔레트의 휠을 부드러운 스크롤로 처리하는 포크(SPEC §14.4): 목록의 자체 휠
# 스크롤을 끄고(`wheel_handoff`) 핸들을 앱의 `SmoothScroll`에 노출한다.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-component = { path = "vendor/gpui-component" }
