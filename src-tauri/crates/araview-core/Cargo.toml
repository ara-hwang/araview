[package]
name = "araview-core"
version = "1.2.2"
description = "AraView image/archive/cache core shared by the desktop shells"
authors = ["Ara"]
license = "EUPL-1.2"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
exif = { package = "kamadak-exif", version = "0.6" }
zip = "8"
tempfile = "3"
jpeg-encoder = "0.7"
jpeg-decoder = { version = "0.3", default-features = false }
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
winreg = "0.56.0"
trash = "5"
image = { version = "0.25", default-features = false, features = ["rayon", "avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "webp"] }
psd = "0.3"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
notify = "8"
rayon = "1"
quick-xml = { version = "0.42", features = ["serialize"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
# restriction 계열이라 `all`에 포함되지 않아 명시적으로 켠다.
undocumented_unsafe_blocks = "warn"
