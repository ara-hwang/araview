[package]
name = "araview"
version = "0.1.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "araview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["dev-mcp"]
dev-mcp = ["dep:tauri-plugin-mcp-bridge"]

[profile.release]
codegen-units = 16
lto = "thin"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-store = "2.4.4"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
exif = { package = "kamadak-exif", version = "0.6" }
zip = "2"
tempfile = "3"
jpeg-encoder = "0.7"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
winreg = "0.56.0"
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }
trash = "3"
image = "0.25"
psd = "0.3"
notify = "8"
sevenz-rust2 = "0.22.2"
unrar-rs = { version = "0.10", default-features = false, features = ["crypto-rust"] }
tar = "0.4"

[dev-dependencies]
rars = "0.9"

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
dependencies = ["libheif[core]"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows", dependencies = ["libheif[core]"] }
