[package]
name = "araview"
version = "1.0.0"
description = "Windows desktop image viewer"
authors = ["Ara"]
license = "EUPL-1.2"
edition = "2021"
rust-version = "1.97"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "araview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["dev-mcp"]
dev-mcp = ["dep:tauri-plugin-mcp-bridge"]

[profile.release]
codegen-units = 16
lto = "thin"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-store = "2.4.4"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-snap-layout = "1"
log = "0.4"
env_logger = "0.11"
exif = { package = "kamadak-exif", version = "0.6" }
zip = "2"
tempfile = "3"
jpeg-encoder = "0.7"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
winreg = "0.56.0"
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }
trash = "3"
image = { version = "0.25", default-features = false, features = ["rayon", "avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "webp"] }
psd = "0.3"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
notify = "8"
quick-xml = { version = "0.42", features = ["serialize"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
# restriction 계열이라 `all`에 포함되지 않아 명시적으로 켠다.
undocumented_unsafe_blocks = "warn"

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
dependencies = ["libheif[core,aom]"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows", dependencies = ["libheif[core,aom]"] }

[workspace]
members = ["crates/araview-thumb"]
