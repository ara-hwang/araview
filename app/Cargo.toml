[package]
name = "araview"
version = "2.9.1"
description = "Desktop image viewer (GPUI Kit) for Windows"
authors = ["Ara"]
license = "EUPL-1.2"
edition = "2024"
rust-version = "1.97"
publish = false

[[bin]]
name = "araview"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9"
araview-core = { path = "../crates/araview-core" }
anyhow = "1"
image = { version = "0.25", default-features = false }
half = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
raw-window-handle = "0.6"
ureq = "3"
rfd = { version = "0.17", default-features = false }
minisign-verify = "0.3"
base64 = "0.23"
tempfile = "3"

# HDR 출력에서 스왑체인 경로를 고르려고 직접 의존한다(루트 Cargo.toml의 포크 patch).
[target.'cfg(windows)'.dependencies]
gpui_windows = { package = "gpui-pre-windows", version = "0.3.12" }
# 글자 인식(OCR)에 쓰는 WinRT 바인딩. GPUI Windows 백엔드와 같은 버전을 써서 중복을 피한다.
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[dev-dependencies]
tempfile = "3"
minisign = "0.10"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
