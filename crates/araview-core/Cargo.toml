[package]
name = "araview-core"
version = "1.2.2"
description = "AraView image/archive/cache core shared by the desktop shells"
authors = ["Ara"]
license = "EUPL-1.2"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
exif = { package = "kamadak-exif", version = "0.6" }
zip = "9.0"
tempfile = "3"
jpeg-encoder = "0.7"
jpeg-decoder = { version = "0.3", default-features = false }
libheif-rs = { version = "3", default-features = false, features = ["v1_21"] }
rawler = "0.8"
trash = "5"
image = { version = "0.25", default-features = false, features = ["rayon", "avif", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
psd = "0.3"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
notify = "8"
rayon = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
jxl-oxide = { version = "0.12", features = ["moxcms"] }
# 동영상 디먹스·디코드. FFmpeg 메이저와 feature를 맞춘다(vcpkg pin은 FFmpeg 8.x).
# link_system_ffmpeg는 PKG_CONFIG_PATH의 FFmpeg를, 없으면 link_vcpkg_ffmpeg가
# vcpkg 제공 FFmpeg로 폴백한다. WTFPL인 ffmpeg-next 계열은 쓰지 않는다.
rsmpeg = { version = "0.18", default-features = false, features = [
    "ffmpeg8",
    "link_system_ffmpeg",
    "link_vcpkg_ffmpeg",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
# restriction 계열이라 `all`에 포함되지 않아 명시적으로 켠다.
undocumented_unsafe_blocks = "warn"
