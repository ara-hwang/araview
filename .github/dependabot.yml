version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-rust-native"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # araview-thumb pins windows-core to the same minor as `windows`;
      # bumping it alone (0.100 vs windows 0.62) breaks the thumbnail DLL.
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
