name: Setup Rust and native dependencies
description: Rust 툴체인, 캐시, sccache, vcpkg 매니페스트 의존성(libheif)을 한 번에 준비한다(Windows).

inputs:
  cache-key:
    description: Rust 캐시를 나누는 접두 키. 같은 OS에서 이를 공유하는 잡끼리 서로의 캐시를 복원한다.
    required: true
  rust-cache-save-if:
    description: "false를 주면 러스트 캐시를 복원만 하고 저장하지 않는다. 같은 키 공간에서 잡이 저장을 두고 경쟁할 때 하나만 저장을 하게 한다."
    required: false
    default: "true"
  sccache:
    description: sccache를 켠다.
    required: false
    default: "false"
  rust-cache-targets:
    description: release 빌드는 sccache를 쓰므로 false로 두어 dev/test 산출물 전송을 생략한다.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: 1.100
        components: clippy, rustfmt

    - name: Setup sccache
      if: inputs.sccache == 'true'
      uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Rust cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: . -> target
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.rust-cache-save-if }}
        cache-targets: ${{ inputs.rust-cache-targets }}

    # VCPKG_INSTALLATION_ROOT는 러너가 프로세스 환경에만 넣어 주는 값이라 `env` 컨텍스트에
    # 없다. `${{ env.VCPKG_INSTALLATION_ROOT }}`를 경로에 쓰면 빈 문자열이 되어 캐시가
    # 저장도 복원도 되지 않으므로(libheif를 매번 8분씩 소스 빌드), 스텝 출력으로 넘긴다.
    # Windows는 동적 링크(x64-windows)라 DLL을 동봉한다.
    - name: Locate vcpkg
      id: vcpkg
      shell: pwsh
      run: |
        "root=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "triplet=x64-windows" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # 캐시 키는 vcpkg.json 전체가 아니라 설치 결과에 영향을 주는 부분
    # (dependencies, overrides, builtin-baseline)만 본다. name과 version-string은
    # 릴리스마다 바뀌지만 설치 패키지는 그대라, 전체 파일을 키에 넣으면 버전을 올리는
    # 릴리스와 Cargo.lock을 바꾸는 dependabot PR마다 캐시가 깨져 libheif를
    # 소스 빌드로 인해 잡당 최대 40분을 잃었다.
    - name: vcpkg dependency hash
      id: vcpkg-hash
      shell: pwsh
      run: |
        $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
        $canonical = ($manifest.dependencies | ConvertTo-Json -Compress -Depth 10) + "`n" + $manifest."builtin-baseline" + "`n" + ($manifest.overrides | ConvertTo-Json -Compress -Depth 10)
        $sha = [System.Security.Cryptography.SHA256]::Create()
        $hash = [System.BitConverter]::ToString($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($canonical))).Replace("-", "").ToLowerInvariant()
        "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # installed만 저장한다. vcpkg는 이 디렉터리의 상태(status)만 보고 이미 설치된
    # 패키지를 건너뛰며, packages와 buildtrees는 수백 MB 이상의 중간 산출물이라
    # 캐시 용량(저장소 전체 10GB)만 잡아먹는다.
    - name: Cache vcpkg
      id: vcpkg-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.vcpkg.outputs.root }}/installed
        # v3: 키가 의존성 해시만 본다. 매니페스트 의존성을 바꾸는 경우처럼 같은 키가
        # 이미 저장돼 있으면 저장이 건너뛰어지므로, 새 키 대신 키 접두사(v3)를 올려
        # 이전 캐시를 무효화해야 한다.
        key: vcpkg-deps-v3-${{ steps.vcpkg.outputs.triplet }}-${{ steps.vcpkg-hash.outputs.hash }}
        restore-keys: |
          vcpkg-deps-v3-${{ steps.vcpkg.outputs.triplet }}-
          vcpkg-deps-v2-${{ steps.vcpkg.outputs.triplet }}-

    # 매니페스트 모드(`vcpkg.json`)라 의존성과 버전 pin이 저장소에 있다.
    # classic 명령(`vcpkg install libheif...`)은 pin을 무시하므로 쓰지 않는다.
    # `--x-install-root`는 pin을 그대로 두고 설치 위치만 vcpkg 루트로 옮긴다.
    # 빌드 스크립트와 pkg-config가 그 위치(`installed/<triplet>`)를 보기 때문이다.
    - name: Install vcpkg dependencies
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: vcpkg install --triplet x64-windows --x-install-root="$env:VCPKG_INSTALLATION_ROOT/installed"

    - name: Configure vcpkg environment
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
