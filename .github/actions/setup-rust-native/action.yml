name: Setup Rust and native dependencies
description: Rust 툴체인, 캐시, 시스템 라이브러리, vcpkg 매니페스트 의존성(libheif, FFmpeg)을 한 번에 준비한다(Windows, Linux, macOS).

inputs:
  cache-key:
    description: Rust 캐시를 나누는 키. 검증과 릴리스 빌드가 서로 덮어쓰지 않게 다르게 준다.
    required: true
  sccache:
    description: sccache를 켠다.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: 1.97
        components: clippy, rustfmt

    - name: Setup sccache
      if: inputs.sccache == 'true'
      uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: . -> target
        shared-key: ${{ inputs.cache-key }}

    # Linux는 GPUI의 X11/Wayland 연동과 libheif 바인딩 생성에 필요한 개발 패키지를 설치한다.
    # 실행 시 Vulkan/Wayland 라이브러리는 동적으로 로드되므로 빌드에는 필요 없다.
    - name: Install Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config cmake nasm clang libclang-dev libasound2-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libx11-xcb-dev \
          libwayland-dev libfontconfig-dev libfreetype-dev

    - name: Install macOS build tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        command -v pkg-config >/dev/null || brew install pkgconf
        # vcpkg 포트가 nasm을 요구할 수 있다. 자동 획득이 실패하는 러너가 있어 직접 설치한다.
        command -v nasm >/dev/null || brew install nasm

    # VCPKG_INSTALLATION_ROOT는 러너가 프로세스 환경에만 넣어 주는 값이라 `env` 컨텍스트에
    # 없다. `${{ env.VCPKG_INSTALLATION_ROOT }}`를 경로에 쓰면 빈 문자열이 되어 캐시가
    # 저장도 복원도 되지 않으므로(libheif를 매번 8분씩 소스 빌드), 스텝 출력으로 넘긴다.
    # Windows는 동적 링크(x64-windows)라 DLL을 동봉하고, Linux와 macOS는 정적 링크
    # (x64-linux, arm64-osx, x64-osx)라 실행 파일 하나에 libheif가 들어간다.
    - name: Locate vcpkg (Windows)
      id: vcpkg-win
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "root=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "triplet=x64-windows" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Locate vcpkg (Linux, macOS)
      id: vcpkg-unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64) triplet=x64-linux ;;
          Linux-ARM64) triplet=arm64-linux ;;
          macOS-ARM64) triplet=arm64-osx ;;
          macOS-X64) triplet=x64-osx ;;
          *) echo "지원하지 않는 러너: ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
        esac
        root="${VCPKG_INSTALLATION_ROOT:-}"
        if [ -z "$root" ] || [ ! -d "$root" ]; then
          # 러너에 vcpkg가 없으면(macOS 이미지 등) 직접 받아 빌드한다.
          root="$HOME/vcpkg"
          if [ ! -x "$root/vcpkg" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "$root"
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
        fi
        echo "root=$root" >> "$GITHUB_OUTPUT"
        echo "triplet=$triplet" >> "$GITHUB_OUTPUT"

    # installed만 저장한다. vcpkg는 이 디렉터리의 상태(status)만 보고 이미 설치된
    # 패키지를 건너뛰며, packages와 buildtrees는 수백 MB 이상의 중간 산출물이라
    # 캐시 용량(저장소 전체 10GB)만 잡아먹는다.
    - name: Cache vcpkg
      id: vcpkg-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ (steps.vcpkg-win.outputs.root || steps.vcpkg-unix.outputs.root) }}/installed
        key: vcpkg-deps-${{ (steps.vcpkg-win.outputs.triplet || steps.vcpkg-unix.outputs.triplet) }}-${{ hashFiles('vcpkg.json', 'Cargo.toml', 'Cargo.lock') }}
        restore-keys: |
          vcpkg-deps-${{ (steps.vcpkg-win.outputs.triplet || steps.vcpkg-unix.outputs.triplet) }}-

    # 매니페스트 모드(`vcpkg.json`)라 의존성과 버전 pin이 저장소에 있다.
    # classic 명령(`vcpkg install libheif...`)은 pin을 무시하므로 쓰지 않는다.
    # `--x-install-root`는 pin을 그대로 두고 설치 위치만 vcpkg 루트로 옮긴다.
    # 빌드 스크립트와 pkg-config가 그 위치(`installed/<triplet>`)를 보기 때문이다.
    - name: Install vcpkg dependencies (Windows)
      if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: vcpkg install --triplet x64-windows --x-install-root="$env:VCPKG_INSTALLATION_ROOT/installed"

    - name: Install vcpkg dependencies (Linux, macOS)
      if: runner.os != 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        root="${{ steps.vcpkg-unix.outputs.root }}"
        "$root/vcpkg" install --triplet "${{ steps.vcpkg-unix.outputs.triplet }}" --x-install-root="$root/installed"

    # Windows는 `FFMPEG_LIBS_DIR`로 prebuilt 바인딩(`FFMPEG_BINDING_PATH`,
    # `.cargo/config.toml` 고정)과 링크 경로를 함께 준다. Linux와 macOS는 pkg-config를
    # 써서 dav1d 같은 전이 정적 의존성까지 링크한다. `FFMPEG_LIBS_DIR`를 주면
    # rusty_ffmpeg이 FFmpeg 라이브러리만 링크해 dav1d 심볼이 빠진다.
    - name: Configure vcpkg environment (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "FFMPEG_LIBS_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
        echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    # 정적 라이브러리라 pkg-config가 `--static`으로 의존 라이브러리까지 풀어야 한다.
    - name: Configure vcpkg environment (Linux, macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        root="${{ steps.vcpkg-unix.outputs.root }}"
        triplet="${{ steps.vcpkg-unix.outputs.triplet }}"
        {
          echo "VCPKG_ROOT=$root"
          echo "VCPKG_DEFAULT_TRIPLET=$triplet"
          echo "PKG_CONFIG_PATH=$root/installed/$triplet/lib/pkgconfig"
          echo "PKG_CONFIG_ALL_STATIC=1"
        } >> "$GITHUB_ENV"
