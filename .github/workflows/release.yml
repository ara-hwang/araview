name: Release

# `vX.Y.Z` 태그를 푸시하면 검증, 서명 빌드, GitHub 릴리스 생성까지 자동으로 돈다.
#   npm run release -- 1.0.1   (버전 올리기, 커밋, 태그, 푸시)
# 태그는 버전을 올린 커밋(package.json, Cargo.toml, Cargo.lock, tauri.conf.json 4곳
# 일치)에 붙여야 하며, 어긋나면 첫 단계에서 실패한다. 실패하면 Actions에서 재실행하거나
# 태그를 지우고 다시 푸시한다. 릴리스 자산은 이 저장소에 게시되고 updater endpoint가
# 그 `latest.json`을 가리킨다. 서명 키는 Secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# 같은 태그의 실행이 겹치면 이전 실행을 취소하지 않고 줄 세운다(릴리스 도중 취소 방지).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  publish-tauri:
    permissions:
      contents: write
      # rustsec/audit-check가 결과를 check run으로 기록하는 데 필요하다.
      checks: write
    runs-on: windows-latest

    steps:
      # 릴리스 노트가 이전 태그 이후 커밋 목록을 쓰므로 전체 히스토리가 필요하다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 태그와 버전 파일이 어긋난 채 릴리스되면 updater가 잘못된 버전을 안내한다.
      # 서명 키가 없으면 빌드는 통과하지만 .sig와 latest.json이 빠져 업데이트가 깨진다.
      - name: Verify tag matches version files and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $lock = (Select-String -Path src-tauri/Cargo.lock -Pattern 'name = "araview"' -Context 0,1 | Select-Object -First 1).Context.PostContext[0] -replace '.*"(.+)".*','$1'
          Write-Host "tag=$tag package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo Cargo.lock=$lock"
          if (($pkg, $tauri, $cargo, $lock | Where-Object { $_ -ne $tag }).Count -gt 0) {
            Write-Error "태그 v$tag 와 버전 파일이 일치하지 않는다."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "Secrets TAURI_SIGNING_PRIVATE_KEY 가 비어 있다."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # ------------------------------------------------------------------
      # 검증. 하나라도 실패하면 아래 빌드/릴리스 단계로 진행하지 않는다.
      # ------------------------------------------------------------------
      - name: Frontend tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97
          components: clippy, rustfmt

      - name: Cargo fmt
        run: cd src-tauri && cargo fmt --check

      - name: Setup sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/packages
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees
          key: vcpkg-libheif-x64-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            vcpkg-libheif-x64-

      - name: Install libheif via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          vcpkg install "libheif[core,aom]:x64-windows"
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure libheif environment
        if: steps.vcpkg-cache.outputs.cache-hit == 'true'
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # PSD 탐색기 썸네일 DLL을 먼저 빌드해 번들 resources에 스테이징한다.
      # tauri.windows.conf.json bundle.resources가 src-tauri/resources/를 참조한다.
      # DLL은 gitignored라 신규 체크아웃에 없으며, 스테이징 없이 cargo test/clippy를
      # 돌리면 tauri 빌드 스크립트가 "resource path doesn't exist"로 실패한다.
      - name: Build PSD thumbnail DLL
        run: |
          cd src-tauri
          cargo build --release -p araview-thumb --no-default-features
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Copy-Item target/release/araview_thumb.dll resources/araview_thumb.dll -Force

      - name: Cargo test
        run: cd src-tauri && cargo test --workspace --no-default-features

      - name: Cargo clippy
        run: cd src-tauri && cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      # 허용 목록 밖의 라이선스(GPL 등), 알 수 없는 레지스트리/git 소스가 들어오면 실패한다.
      # 설정: src-tauri/deny.toml. 설치 바이너리는 rust-cache가 함께 캐시한다.
      - name: Rust license and source check
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cd src-tauri && cargo deny check licenses bans sources

      # ------------------------------------------------------------------
      # 릴리스. 검증을 모두 통과한 뒤에만 실행된다.
      # PSD 썸네일 DLL은 위 검증 단계에서 이미 스테이징되어 있다.
      # ------------------------------------------------------------------
      # 릴리스 노트: 이전 태그 이후 커밋 목록으로 본문을 만든다.
      # tauri-action은 파일을 읽지 못하므로 multiline output으로 전달한다.
      - name: Generate release notes
        id: notes
        run: |
          # git 한글 커밋 메시지가 깨지지 않게 stdout을 UTF-8로 디코드한다.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = "" }
          if ([string]::IsNullOrWhiteSpace($prev)) {
            $range = $tag
            $compare = ""
          } else {
            $range = "$prev..$tag"
            $compare = "$prev...$tag"
          }
          $log = git log $range --pretty=format:'- %s (%h)'
          $changes = $log -join "`n"
          $compareLine = ""
          if ($compare -ne "") {
            $compareLine = "`n전체 비교: https://github.com/${{ github.repository }}/compare/$compare`n"
          }
          # 본문 형식은 .github/RELEASE_TEMPLATE.md에서 고친다.
          $body = (Get-Content .github/RELEASE_TEMPLATE.md -Raw -Encoding utf8).TrimEnd()
          $body = $body.Replace("{{CHANGES}}", $changes).Replace("{{COMPARE}}", $compareLine)
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Updater 서명: maintainer는 한 번만 키를 만들고 Secrets에 등록한다.
      #   npm run tauri signer generate -- -w ~/.tauri/araview.key
      # 공개키는 src-tauri/tauri.conf.json plugins.updater.pubkey에,
      # 비밀키와 비밀번호는 repo Secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)에 넣는다.
      # 키가 없으면 위 검증 단계에서 먼저 실패한다.
      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # RELEASE_TOKEN(contents: write PAT)이 등록돼 있으면 그것을 쓰고, 없으면 GITHUB_TOKEN을 쓴다.
          # 저장소 기본 워크플로 권한을 read로 유지하려면 RELEASE_TOKEN이 필요하다.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RUSTC_WRAPPER: sccache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AraView v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # `tauri build`는 --no-default-features를 자체 옵션으로 받지 않는다.
          # -- 뒤에 두면 cargo로 그대로 전달되어 dev-mcp가 릴리스에서 빠진다.
          args: -- --no-default-features
