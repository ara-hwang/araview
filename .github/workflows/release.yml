name: Release

# `vX.Y.Z`(안정) 또는 `vX.Y.Z-beta.N`(베타) 태그를 푸시하면 검증, 세 OS 빌드
# (Windows 설치 프로그램과 서명, Linux tar.gz, macOS dmg), GitHub 릴리스 생성까지
# 자동으로 돈다.
#   npm run release -- 2.0.1     (release에서 안정 릴리스)
#   npm run release -- beta      (main에서 베타 릴리스)
# 태그는 버전을 올린 커밋(app/Cargo.toml, Cargo.lock 2곳 일치)에 붙여야 하며,
# 어긋나면 첫 단계에서 실패한다. 실패하면 Actions에서 재실행하거나 태그를 지우고 다시
# 푸시한다. 안정 릴리스는 `update-feed.json`과 `latest-gpui.json`을, 베타 릴리스는
# `update-feed-beta.json`을 만들고 롤링 `beta` 프리릴리스의 피드 자산을 덮어쓴다.
# 서명 키는 Secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)다(이름은 예전 Tauri 시절
# 그대로 두었다. 키 형식은 minisign이다).
#
# Actions 탭에서 수동 실행(workflow_dispatch)하면 릴리스를 만들지 않고 같은 과정을 끝까지
# 돌려 설치 프로그램, 서명, 피드, Linux·macOS 패키지를 아티팩트로만 남긴다. 태그를 달기 전에 파이프라인을
# 시험할 때 쓴다.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:

# 같은 태그의 실행이 겹치면 이전 실행을 취소하지 않고 줄 세운다(릴리스 도중 취소 방지).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

permissions:
  contents: read

jobs:
  # 태그와 서명 키를 먼저 확인한다. 어긋나면 긴 검증을 돌리기 전에 바로 실패한다.
  preflight:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 태그와 버전 파일이 어긋난 채 릴리스되면 업데이트 확인이 잘못된 버전을 안내한다.
      # 서명 키가 없으면 빌드는 통과하지만 서명과 피드가 빠져 업데이트가 깨진다.
      - name: Verify tag matches version files and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $cargo = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $lock = (Select-String -Path Cargo.lock -Pattern 'name = "araview"' -Context 0,1 | Select-Object -First 1).Context.PostContext[0] -replace '.*"(.+)".*','$1'
          Write-Host "Cargo.toml=$cargo Cargo.lock=$lock"
          if ($cargo -ne $lock) {
            Write-Error "Cargo.toml($cargo)과 Cargo.lock($lock)의 버전이 다르다."
            exit 1
          }
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($cargo -ne $tag) {
              Write-Error "태그 v$tag 와 버전 파일($cargo)이 일치하지 않는다."
              exit 1
            }
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "Secrets TAURI_SIGNING_PRIVATE_KEY 가 비어 있다."
            exit 1
          }

  # 검증은 ci.yml을 그대로 재사용한다. 실패하면 빌드 잡은 시작하지 않는다.
  verify:
    needs: preflight
    permissions:
      contents: read
      # rustsec/audit-check가 결과를 check run으로 기록하는 데 필요하다.
      checks: write
    uses: ./.github/workflows/ci.yml

  # Windows 설치 프로그램 빌드, 서명, 업데이트 피드 생성. 릴리스는 마지막 `release` 잡이 만든다.
  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # 릴리스 노트가 이전 태그 이후 커밋 목록을 쓰므로 전체 히스토리가 필요하다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 서명에 Tauri CLI의 signer를 쓴다(npx로 받아 쓰고 저장소에는 의존성을 두지 않는다).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: release
          sccache: "true"

      - name: Resolve version
        id: version
        run: |
          $version = (Select-String -Path app/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # 수동 실행에는 태그가 없으므로 노트의 기준을 현재 커밋으로 한다.
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "HEAD" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # 베타 태그는 프리릴리스와 베타 피드를 만든다. 수동 실행은 안정 경로를 시험한다.
          $channel = if ("$tag" -match "-beta\.") { "beta" } else { "stable" }
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 설치 프로그램은 NSIS(makensis)로 만든다. 러너에 기본 설치돼 있지 않으므로 먼저 받는다.
      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { Write-Error "NSIS 설치 실패"; exit 1 }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { Write-Error "makensis를 찾지 못했다"; exit 1 }

      - name: Build installer
        env:
          RUSTC_WRAPPER: sccache
        run: pwsh -NoProfile -File scripts/Build-Installer.ps1

      # 릴리스 노트: 이전 태그 이후 커밋 목록으로 본문을 만든다.
      - name: Generate release notes
        run: |
          # git 한글 커밋 메시지가 깨지지 않게 stdout을 UTF-8로 디코드한다.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $tag = "${{ steps.version.outputs.tag }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = "" }
          if ([string]::IsNullOrWhiteSpace($prev)) {
            $range = $tag
            $compare = ""
          } else {
            $range = "$prev..$tag"
            $compare = "$prev...$tag"
          }
          # 커밋 제목의 접두사로 분류한다. feat는 새 기능, fix는 수정, refactor와 perf는 개선,
          # 느낌표가 붙은 것(feat!: 등)은 변경이다. docs, chore, ci, build, test, style,
          # 머지 커밋은 사용자에게 보이지 않으므로 뺀다.
          $groups = [ordered]@{ "변경" = @(); "새 기능" = @(); "수정" = @(); "개선" = @() }
          foreach ($subject in @(git log $range --no-merges --pretty=format:'%s')) {
            if ($subject -notmatch '^(?<type>[a-z]+)(\([^)]*\))?(?<bang>!)?:\s*(?<text>.+)$') { continue }
            $text = $Matches.text
            if ($Matches.bang) { $groups["변경"] += $text; continue }
            switch ($Matches.type) {
              "feat" { $groups["새 기능"] += $text }
              "fix" { $groups["수정"] += $text }
              { $_ -in "refactor", "perf" } { $groups["개선"] += $text }
            }
          }
          $sections = foreach ($name in $groups.Keys) {
            if ($groups[$name].Count -gt 0) {
              "### $name`n`n" + (($groups[$name] | ForEach-Object { "- $_" }) -join "`n")
            }
          }
          $changes = if ($sections) { $sections -join "`n`n" } else { "사용자에게 보이는 변경 없음" }
          $compareLine = ""
          if ($compare -ne "") {
            $compareLine = "`n전체 비교: https://github.com/${{ github.repository }}/compare/$compare`n"
          }
          # 본문 형식은 .github/RELEASE_TEMPLATE.md에서 고친다.
          $body = (Get-Content .github/RELEASE_TEMPLATE.md -Raw -Encoding utf8).TrimEnd()
          $body = $body.Replace("{{CHANGES}}", $changes).Replace("{{COMPARE}}", $compareLine)
          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          # 앱의 업데이트 대화상자에는 변경 목록만 보여준다.
          Set-Content -Path feed-notes.md -Value $changes -Encoding utf8

      # 업데이트 서명: maintainer는 한 번만 키를 만들고 Secrets에 등록한다(docs/releasing.md).
      # 공개키는 app/update-pubkey.txt에, 비밀키와 비밀번호는 repo Secrets에 넣는다.
      - name: Sign installer and write feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $version = "${{ steps.version.outputs.version }}"
          $channel = "${{ steps.version.outputs.channel }}"
          $installer = "target/AraView-$version-setup.exe"
          npx --yes @tauri-apps/cli@2.11.4 signer sign $installer
          if ($LASTEXITCODE -ne 0) { Write-Error "설치 프로그램 서명 실패"; exit 1 }
          $feed = [ordered]@{
            version = $version
            notes = (Get-Content feed-notes.md -Raw -Encoding utf8).Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content "$installer.sig" -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/AraView-$version-setup.exe"
              }
            }
          }
          $feedName = if ($channel -eq "beta") { "update-feed-beta.json" } else { "update-feed.json" }
          $feed | ConvertTo-Json -Depth 5 | Set-Content -Path $feedName -Encoding utf8
          if ($channel -eq "stable") {
            # 2.5.0 이하 설치본은 옛 이름 `latest-gpui.json`을 확인하므로 같은 내용을 한 벌 더 올린다.
            Copy-Item update-feed.json latest-gpui.json
          }

      # 릴리스 생성은 세 OS 빌드가 모두 끝난 뒤 `release` 잡이 한 번에 한다.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            target/AraView-*-setup.exe
            target/AraView-*-setup.exe.sig
            update-feed*.json
            latest-gpui.json
            release-notes.md
            feed-notes.md
          retention-days: 7

  # Linux 묶음(tar.gz). 업데이트 피드에는 넣지 않으며 릴리스 자산으로만 올린다.
  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: release-ubuntu-latest

      - name: Build Linux package
        run: scripts/package-linux.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: target/AraView-*-linux-*.tar.gz
          retention-days: 7

  # macOS 디스크 이미지(.dmg). ad-hoc 서명만 붙이고 공증하지 않는다.
  build-macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: release-macos-latest

      - name: Build macOS package
        run: scripts/package-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: target/AraView-*-macos-*.dmg
          retention-days: 7

  release:
    needs: [build-windows, build-linux, build-macos]
    permissions:
      contents: write
      # `gh run download`가 같은 실행의 아티팩트를 읽는 데 필요하다.
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 같은 실행에서 올린 세 OS의 아티팩트를 받아 한 폴더로 모은다.
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern 'release-*' --dir raw
          mkdir dist
          find raw -type f -exec cp {} dist/ \;

      - name: List assets and write checksums
        working-directory: dist
        run: |
          # 업데이트 피드는 Windows 설치 프로그램만 서명해 가리킨다. 나머지는 체크섬으로 확인한다.
          ls -R .
          sha256sum AraView-*-linux-*.tar.gz AraView-*-macos-*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 1.x(Tauri) 설치본은 `releases/latest/download/latest.json`을 확인한다. 2.x가 Latest인 동안 이 파일이 없으면
      # 업데이트 확인이 404가 되므로, 마지막 1.x(1.2.3)의 피드를 그대로 올려 1.2.3까지만 안내하고 2.x로 자동 갱신되지 않게 한다.
      - name: Fetch legacy 1.x feed
        if: github.ref_type == 'tag' && !contains(github.ref_name, '-beta.')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/legacy-feed
          path: legacy

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # 안정 릴리스에만 옛 1.x 피드와 latest-gpui.json을 붙인다.
          assets=(
            dist/AraView-*-setup.exe
            dist/update-feed*.json
            dist/AraView-*-linux-*.tar.gz
            dist/AraView-*-macos-*.dmg
            dist/SHA256SUMS.txt
          )
          flags=()
          if [[ "${{ github.ref_name }}" == *"-beta."* ]]; then
            # 프리릴리스는 Latest가 되지 않으므로 안정 채널의 releases/latest를 건드리지 않는다.
            flags=(--prerelease --latest=false)
          else
            assets+=(dist/latest-gpui.json legacy/.github/legacy-feed/latest.json)
          fi
          gh release create "${{ github.ref_name }}" \
            "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --title "AraView ${{ github.ref_name }}" \
            --notes-file dist/release-notes.md \
            "${flags[@]}"

      # 베타 피드는 버전마다 새 릴리스에 올리면 앱이 고정 URL로 찾을 수 없다. 롤링
      # `beta` 프리릴리스의 자산을 덮어써 항상 최신 베타를 가리키게 한다.
      - name: Update rolling beta feed
        if: github.ref_type == 'tag' && contains(github.ref_name, '-beta.')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view beta --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create beta \
              --repo "${{ github.repository }}" \
              --target main \
              --prerelease \
              --title "AraView beta feed" \
              --notes "베타 채널 업데이트 피드"
          fi
          gh release upload beta dist/update-feed-beta.json \
            --clobber \
            --repo "${{ github.repository }}"

      # 수동 실행(시험)에서는 릴리스 대신 산출물을 아티팩트로 남긴다.
      - name: Upload dry-run artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist
          retention-days: 7
