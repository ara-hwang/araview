name: Release

# `vX.Y.Z` 태그를 푸시하면 검증, 서명 빌드, GitHub 릴리스 생성까지 자동으로 돈다.
#   npm run release -- 1.0.1   (버전 올리기, 커밋, 태그, 푸시)
# 태그는 버전을 올린 커밋(package.json, Cargo.toml, Cargo.lock, tauri.conf.json 4곳
# 일치)에 붙여야 하며, 어긋나면 첫 단계에서 실패한다. 실패하면 Actions에서 재실행하거나
# 태그를 지우고 다시 푸시한다. 릴리스 자산은 이 저장소에 게시되고 updater endpoint가
# 그 `latest.json`을 가리킨다. 서명 키는 Secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# 같은 태그의 실행이 겹치면 이전 실행을 취소하지 않고 줄 세운다(릴리스 도중 취소 방지).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

permissions:
  contents: read

jobs:
  # 태그와 서명 키를 먼저 확인한다. 어긋나면 긴 검증을 돌리기 전에 바로 실패한다.
  preflight:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 태그와 버전 파일이 어긋난 채 릴리스되면 updater가 잘못된 버전을 안내한다.
      # 서명 키가 없으면 빌드는 통과하지만 .sig와 latest.json이 빠져 업데이트가 깨진다.
      - name: Verify tag matches version files and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $lock = (Select-String -Path src-tauri/Cargo.lock -Pattern 'name = "araview"' -Context 0,1 | Select-Object -First 1).Context.PostContext[0] -replace '.*"(.+)".*','$1'
          Write-Host "tag=$tag package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo Cargo.lock=$lock"
          if (($pkg, $tauri, $cargo, $lock | Where-Object { $_ -ne $tag }).Count -gt 0) {
            Write-Error "태그 v$tag 와 버전 파일이 일치하지 않는다."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "Secrets TAURI_SIGNING_PRIVATE_KEY 가 비어 있다."
            exit 1
          }

  # 검증은 ci.yml을 그대로 재사용한다. 실패하면 publish-tauri는 시작하지 않는다.
  verify:
    needs: preflight
    permissions:
      contents: read
      # rustsec/audit-check가 결과를 check run으로 기록하는 데 필요하다.
      checks: write
    uses: ./.github/workflows/ci.yml

  publish-tauri:
    needs: verify
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # 릴리스 노트가 이전 태그 이후 커밋 목록을 쓰므로 전체 히스토리가 필요하다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # PSD 썸네일 DLL도 이 단계에서 스테이징된다.
      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: release
          sccache: "true"

      # ------------------------------------------------------------------
      # 릴리스. verify 잡을 통과한 뒤에만 실행된다.
      # ------------------------------------------------------------------
      # 릴리스 노트: 이전 태그 이후 커밋 목록으로 본문을 만든다.
      # tauri-action은 파일을 읽지 못하므로 multiline output으로 전달한다.
      - name: Generate release notes
        id: notes
        run: |
          # git 한글 커밋 메시지가 깨지지 않게 stdout을 UTF-8로 디코드한다.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = "" }
          if ([string]::IsNullOrWhiteSpace($prev)) {
            $range = $tag
            $compare = ""
          } else {
            $range = "$prev..$tag"
            $compare = "$prev...$tag"
          }
          # 커밋 제목의 접두사로 분류한다. feat는 새 기능, fix는 수정, refactor와 perf는 개선,
          # 느낌표가 붙은 것(feat!: 등)은 변경이다. docs, chore, ci, build, test, style,
          # 머지 커밋은 사용자에게 보이지 않으므로 뺀다.
          $groups = [ordered]@{ "변경" = @(); "새 기능" = @(); "수정" = @(); "개선" = @() }
          foreach ($subject in @(git log $range --no-merges --pretty=format:'%s')) {
            if ($subject -notmatch '^(?<type>[a-z]+)(\([^)]*\))?(?<bang>!)?:\s*(?<text>.+)$') { continue }
            $text = $Matches.text
            if ($Matches.bang) { $groups["변경"] += $text; continue }
            switch ($Matches.type) {
              "feat" { $groups["새 기능"] += $text }
              "fix" { $groups["수정"] += $text }
              { $_ -in "refactor", "perf" } { $groups["개선"] += $text }
            }
          }
          $sections = foreach ($name in $groups.Keys) {
            if ($groups[$name].Count -gt 0) {
              "### $name`n`n" + (($groups[$name] | ForEach-Object { "- $_" }) -join "`n")
            }
          }
          $changes = if ($sections) { $sections -join "`n`n" } else { "사용자에게 보이는 변경 없음" }
          $compareLine = ""
          if ($compare -ne "") {
            $compareLine = "`n전체 비교: https://github.com/${{ github.repository }}/compare/$compare`n"
          }
          # 본문 형식은 .github/RELEASE_TEMPLATE.md에서 고친다.
          $body = (Get-Content .github/RELEASE_TEMPLATE.md -Raw -Encoding utf8).TrimEnd()
          $body = $body.Replace("{{CHANGES}}", $changes).Replace("{{COMPARE}}", $compareLine)
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Updater 서명: maintainer는 한 번만 키를 만들고 Secrets에 등록한다.
      #   npm run tauri signer generate -- -w ~/.tauri/araview.key
      # 공개키는 src-tauri/tauri.conf.json plugins.updater.pubkey에,
      # 비밀키와 비밀번호는 repo Secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)에 넣는다.
      # 키가 없으면 위 검증 단계에서 먼저 실패한다.
      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # RELEASE_TOKEN(contents: write PAT)이 등록돼 있으면 그것을 쓰고, 없으면 GITHUB_TOKEN을 쓴다.
          # 저장소 기본 워크플로 권한을 read로 유지하려면 RELEASE_TOKEN이 필요하다.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RUSTC_WRAPPER: sccache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AraView v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # `tauri build`는 --no-default-features를 자체 옵션으로 받지 않는다.
          # -- 뒤에 두면 cargo로 그대로 전달되어 dev-mcp가 릴리스에서 빠진다.
          args: -- --no-default-features
