name: CI

# 프론트엔드 검사는 PR과 main 푸시에서 자동으로 돈다.
# Rust 검사는 비용이 커서 Actions 탭 수동 실행(workflow_dispatch)과
# 릴리스(release.yml이 workflow_call로 호출)에서만 돈다.
# 릴리스 검증은 이 파일을 그대로 재사용하므로 검증 항목은 여기서만 고친다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # 태그(릴리스) 검증은 도중에 취소하지 않는다.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests with coverage
        run: npm run test:coverage

      - name: Type check
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

      # 문서-코드 정합성 (확장자, IPC, 설정, 플러그인, 버전, plan, i18n 잔재).
      - name: Docs consistency
        run: npm run docs:check

      # moderate 이상 새 자문이 있으면 실패한다. 업스트림 패치가 아직 없는
      # 자문만 scripts/audit-frontend.mjs의 허용 목록에 이유와 추적 링크를 남긴다.
      - name: Frontend dependency audit
        run: npm run audit:frontend

  rust:
    # PR과 main 푸시에서는 건너뛴다. workflow_call에서는 event_name이 호출자(태그 푸시)
    # 것이라 ref_type으로 릴리스 호출을 구분한다.
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # rustsec/audit-check가 결과를 check run으로 기록하는 데 필요하다.
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: verify

      - name: Cargo fmt
        run: cd src-tauri && cargo fmt --check

      - name: Cargo test
        run: cd src-tauri && cargo test --workspace --no-default-features

      - name: Cargo clippy
        run: cd src-tauri && cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      # RustSec 자문 DB 대조. 발견 시 실패한다. 정보성 자문은 통과.
      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      # 허용 목록 밖의 라이선스(GPL 등), 알 수 없는 레지스트리/git 소스가 들어오면 실패한다.
      # 설정: src-tauri/deny.toml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Rust license and source check
        run: cd src-tauri && cargo deny check licenses bans sources
