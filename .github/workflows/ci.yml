name: CI

# 프론트엔드 검사는 PR과 main 푸시에서 자동으로 돈다.
# Rust는 두 단계다. 전체 검증(rust 잡: fmt, test, clippy, audit, deny)은 비용이
# 커서 Actions 탭 수동 실행(workflow_dispatch)과 릴리스(release.yml이
# workflow_call로 호출)에서만 돈다. 대신 PR에서 src-tauri나 Cargo.lock이 바뀌면
# 가벼운 rust-check 잡(cargo check, 기본 feature와 --no-default-features)이 돌아
# 의존성 업데이트가 빌드를 깨는 것을 병합 전에 잡는다. main 푸시에서도 같은 조건으로
# 돌리는 이유는 캐시다. PR은 자기 ref와 main의 캐시만 복원할 수 있어서, main이
# 캐시를 저장해 두지 않으면 모든 PR이 빈 캐시로 시작한다.
# 릴리스 검증은 이 파일을 그대로 재사용하므로 검증 항목은 여기서만 고친다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR 브랜치의 이전 실행만 취소한다. main 푸시가 연달아 들어와도 앞선 실행이
  # 끝까지 돌아야 하고, 태그(릴리스) 검증도 도중에 취소하지 않는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # 서로 독립적인 검사라 한 그룹으로 동시에 돌린다. 그룹 끝에 암묵적 wait가 있어
      # 하나라도 실패하면 잡이 실패하고, 실패한 검사의 로그는 스텝별로 따로 남는다.
      # 가장 오래 걸리는 테스트도 같은 그룹에 넣어, 잡 시간이 가장 느린 검사 하나로 정해진다.
      - parallel:
          - name: Frontend lint
            run: npm run lint

          - name: Type check
            run: npx tsc --noEmit

          - name: Format check
            run: npm run format:check

          # 문서-코드 정합성 (확장자, IPC, 설정, 플러그인, 버전, plan, i18n 잔재).
          - name: Docs consistency
            run: npm run docs:check

          # moderate 이상 새 자문이 있으면 실패한다. 업스트림 패치가 아직 없는
          # 자문만 scripts/audit-frontend.mjs의 허용 목록에 이유와 추적 링크를 남긴다.
          - name: Frontend dependency audit
            run: npm run audit:frontend

          - name: Frontend tests with coverage
            run: npm run test:coverage

  # Rust 쪽 파일이 바뀐 PR과 main 푸시에서만 rust-check를 돌리기 위한 판별 잡.
  # 태그(릴리스)는 rust 잡이 맡으므로 제외한다. workflow_call에서는 event_name이
  # 호출자(태그 푸시) 것이라 ref_type으로 거른다.
  changes:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Rust-related changes
        id: filter
        env:
          # PR은 베이스 커밋, 푸시는 푸시 직전 커밋과 비교한다.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 비교 대상을 못 찾으면(새 브랜치의 0 커밋, 강제 푸시 등) 안전하게 돌린다.
          if ! files=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null); then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif echo "$files" | grep -Eq '^(src-tauri/|\.github/actions/setup-rust-native/|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # 풀 검증(rust 잡)보다 훨씬 싼 컴파일 검사. 기본 feature(dev-mcp 포함)와
  # 릴리스 feature를 모두 확인한다. 풀 검증은 --no-default-features만 보기 때문에
  # mcp-bridge가 tauri와 어긋나는 문제는 여기서만 잡힌다.
  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: check

      - name: Cargo check (default features, dev-mcp)
        run: cd src-tauri && cargo check --workspace --all-targets

      - name: Cargo check (release features)
        run: cd src-tauri && cargo check --workspace --all-targets --no-default-features

  rust:
    # PR과 main 푸시에서는 건너뛴다. workflow_call에서는 event_name이 호출자(태그 푸시)
    # 것이라 ref_type으로 릴리스 호출을 구분한다.
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # rustsec/audit-check가 결과를 check run으로 기록하는 데 필요하다.
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: verify

      # cargo-deny는 백그라운드 검사가 쓰기 전에 설치해 둔다.
      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-deny@0.20.2

      # 컴파일이 필요 없는 감사와 라이선스 검사는 백그라운드로 시작해, 오래 걸리는
      # cargo test와 clippy 뒤에 숨긴다. 실패는 아래 wait 시점에 잡이 실패로 전파된다.
      # RustSec 자문 DB 대조. 발견 시 실패한다. 정보성 자문은 통과.
      - name: Rust dependency audit
        id: rust-audit
        background: true
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      # 허용 목록 밖의 라이선스(GPL 등), 알 수 없는 레지스트리/git 소스가 들어오면 실패한다.
      # 설정: src-tauri/deny.toml.
      - name: Rust license and source check
        id: rust-deny
        background: true
        run: cd src-tauri && cargo deny check licenses bans sources

      - name: Cargo fmt
        run: cd src-tauri && cargo fmt --check

      - name: Cargo test
        run: cd src-tauri && cargo test --workspace --no-default-features

      - name: Cargo clippy
        run: cd src-tauri && cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: Wait for audit and license checks
        wait: [rust-audit, rust-deny]
