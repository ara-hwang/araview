name: CI

# 자동 실행은 꺼 두었다. PR과 main 푸시에서는 돌지 않는다.
# Actions 탭에서 이 워크플로를 직접 실행(workflow_dispatch)할 때만 검사한다.
# 릴리스(태그)는 release.yml이 담당한다.
# 검증 항목과 커맨드는 release.yml의 검증 단계와 같게 유지한다.
# (린트, 커버리지 포함 테스트, 타입, 포맷, 의존성 감사, cargo test/clippy)
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests with coverage
        run: npm run test:coverage

      - name: Type check
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

      # moderate 이상 취약점이 있으면 실패한다. 로컬 기준선: 0건.
      - name: Frontend dependency audit
        run: npm audit --audit-level=moderate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97
          components: clippy, rustfmt

      - name: Cargo fmt
        run: cd src-tauri && cargo fmt --check

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cache vcpkg
        id: vcpkg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
            ${{ env.VCPKG_INSTALLATION_ROOT }}/packages
            ${{ env.VCPKG_INSTALLATION_ROOT }}/buildtrees
          key: vcpkg-libheif-x64-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            vcpkg-libheif-x64-

      - name: Install libheif via vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          vcpkg install "libheif[core]:x64-windows"
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure libheif environment
        if: steps.vcpkg-cache.outputs.cache-hit == 'true'
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build PSD thumbnail DLL
        run: |
          cd src-tauri
          cargo build --release -p araview-thumb --no-default-features
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Copy-Item target/release/araview_thumb.dll resources/araview_thumb.dll -Force

      - name: Cargo test
        run: cd src-tauri && cargo test --workspace --no-default-features

      - name: Cargo clippy
        run: cd src-tauri && cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      # RustSec 자문 DB 대조. 발견 시 실패한다. 정보성 자문은 통과.
      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
