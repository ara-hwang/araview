name: CI

# 문서 정합성은 PR과 main 푸시에서 자동으로 돈다.
# Rust는 두 단계다. 전체 검증(rust 잡: fmt, test, clippy, audit, deny)은 비용이
# 커서 Actions 탭 수동 실행(workflow_dispatch)과 릴리스(release.yml이
# workflow_call로 호출)에서만 돈다. 대신 Rust 쪽 파일이 바뀐 PR에서는 가벼운
# rust-check 잡(cargo check)이 돌아 의존성 업데이트가 빌드를 깨는 것을 병합 전에
# 잡는다. main 푸시에서도 같은 조건으로 돌리는 이유는 캐시다. PR은 자기 ref와
# main의 캐시만 복원할 수 있어서, main이 캐시를 저장해 두지 않으면 모든 PR이 빈
# 캐시로 시작한다.
# 릴리스 검증은 이 파일을 그대로 재사용하므로 검증 항목은 여기서만 고친다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR 브랜치의 이전 실행만 취소한다. main 푸시가 연달아 들어와도 앞선 실행이
  # 끝까지 돌아야 하고, 태그(릴리스) 검증도 도중에 취소하지 않는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # 문서-코드 정합성 (버전, 지원 확장자, 설정 키, plan 잔류).
      - name: Docs consistency
        run: node scripts/check-docs.mjs

  # Rust 쪽 파일이 바뀐 PR과 main 푸시에서만 rust-check를 돌리기 위한 판별 잡.
  # 태그(릴리스)는 rust 잡이 맡으므로 제외한다. workflow_call에서는 event_name이
  # 호출자(태그 푸시) 것이라 ref_type으로 거른다.
  changes:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Rust-related changes
        id: filter
        env:
          # PR은 베이스 커밋, 푸시는 푸시 직전 커밋과 비교한다.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 비교 대상을 못 찾으면(새 브랜치의 0 커밋, 강제 푸시 등) 안전하게 돌린다.
          if ! files=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null); then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif echo "$files" | grep -Eq '^(crates/|src-gpui/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|deny\.toml$|\.cargo/|\.github/actions/setup-rust-native/|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  # 풀 검증(rust 잡)보다 훨씬 싼 컴파일 검사.
  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: check

      - name: Cargo check
        run: cargo check --workspace --all-targets

  rust:
    # PR과 main 푸시에서는 건너뛴다. workflow_call에서는 event_name이 호출자(태그 푸시)
    # 것이라 ref_type으로 릴리스 호출을 구분한다.
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # rustsec/audit-check가 결과를 check run으로 기록하는 데 필요하다.
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust-native
        with:
          cache-key: verify

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # RustSec 자문 DB 대조. 발견 시 실패한다. 정보성 자문은 통과.
      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 허용 목록 밖의 라이선스(GPL 등), 알 수 없는 레지스트리/git 소스가 들어오면 실패한다.
      # 설정: deny.toml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Rust license and source check
        run: cargo deny check licenses bans sources
