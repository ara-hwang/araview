name: 기능 제안
description: 새 기능이나 개선 아이디어
title: "[제안] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 지금 어떤 점이 불편한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
