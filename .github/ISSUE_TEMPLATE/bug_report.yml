name: 버그 제보
description: 동작이 이상하거나 오류가 날 때
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 같은 문제가 이미 올라왔는지 먼저 검색해 주세요.
        보안 취약점은 이슈로 올리지 말고 [비공개 제보](https://github.com/ara-hwang/araview/security/advisories/new)를 이용해 주세요.
  - type: input
    id: version
    attributes:
      label: AraView 버전
      description: 설정 일반 탭의 업데이트 항목에서 확인할 수 있습니다.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 버전
      placeholder: "Windows 11 24H2 (x64)"
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: 문제가 생긴 파일 형식
      description: 특정 파일에서만 생기면 확장자를 적어 주세요.
      placeholder: "png, heic, cbz, psd ..."
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 어떤 순서로 하면 문제가 생기는지 적어 주세요.
      placeholder: |
        1. 폴더를 드래그 앤 드롭으로 연다
        2. 양쪽 보기로 바꾼다
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
      description: 스크린샷이나 문제가 되는 샘플 파일(공유 가능한 것만)을 첨부해 주세요.
